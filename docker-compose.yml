services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      MAX_CONCURRENT_SESSIONS: 5
      CONNECTION_TIMEOUT: 60000
      TOKEN: ${BROWSERLESS_TOKEN}
    ports:
      - "3000:3000"

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:cached
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-graceful-shutdown", "5"]

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browserless:
        condition: service_started
    volumes:
      - ./backend:/app:cached
      - hf_cache:/root/.cache/huggingface
    command: celery -A worker.celery_app worker -l info -Q default,scrape

  beat:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app:cached
    command: celery -A worker.celery_app beat -l info

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "3001:80"

volumes:
  postgres_data:
  redis_data:
  hf_cache:
